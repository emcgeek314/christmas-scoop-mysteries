const names=['Christmas Main Street','Village Square','Evergreen Lane',"Santa’s Corner"], art=['main-street.png','village-square.png','evergreen-lane.png','santas-corner.png'], panoramas=['main-street-reward.jpg','village-square-reward.png','evergreen-lane-reward.png','santas-corner-reward.png'];
let rows=[],chapter=0,request=0;const token=location.hash.slice(1);const valid=/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;

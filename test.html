<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Christmas Scoop Mysteries | Connection Test</title><style>body{margin:0;background:radial-gradient(ellipse at top,#24495c,#102b3c 65%);color:#f4d69e;font-family:Georgia,serif;min-height:100vh}main{max-width:440px;margin:auto;padding:40px 20px}h1{text-align:center}form,section{background:#102b3c;border:1px solid #b99b66;border-radius:14px;padding:22px;margin-top:20px}label{display:block;margin:14px 0 6px}input,button{box-sizing:border-box;width:100%;padding:13px;font-size:16px;border-radius:7px}input{border:1px solid #b99b66;background:#fffaf0;color:#102b3c}button{margin-top:18px;background:#f4d69e;color:#102b3c;border:0;font-weight:bold;cursor:pointer}button:disabled{opacity:.5}#status{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.6}small{display:block;text-align:center} [hidden]{display:none!important}</style></head><body><main><h1>🍨 Christmas Scoop Mysteries</h1><small>Phase 13A · Connection test</small><form id="login"><label for="email">Email</label><input id="email" type="email" autocomplete="username" required><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required><button id="submit" disabled>Sign in</button></form><section><div id="status" role="status" aria-live="polite">Connecting…</div><button id="logout" hidden>Sign out</button></section></main><script type="module">
const status=document.getElementById('status'),form=document.getElementById('login'),submit=document.getElementById('submit'),logout=document.getElementById('logout');
try{
const {createClient}=await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm');
const db=createClient('https://qblscovrlsqktkegvjgs.supabase.co','sb_publishable_4dFvE-VcKzqvATDqmKeswg_hq_5pomp');
async function inspect(session){form.hidden=!!session;logout.hidden=!session;if(!session){status.textContent='Ready to sign in.';return;}status.textContent='Signed in. Checking database…';const {data:p,error:e}=await db.rpc('get_my_profile');if(e)throw e;const profile=p?.[0];if(!profile)throw new Error('No assigned user role.');let lines=['✓ Authentication successful','Name: '+profile.display_name,'Role: '+profile.role];if(profile.role==='participant'){const {data:c,error:ce}=await db.rpc('get_calendar');if(ce)throw ce;lines.push('Calendar days: '+c.length,'Unlocked doors: '+c.filter(x=>x.is_unlocked).length,'Locked doors: '+c.filter(x=>!x.is_unlocked).length,'Revealed doors: '+c.filter(x=>x.is_revealed).length,'Exposed building names/images: '+c.filter(x=>x.building_name||x.building_image).length);}else{lines.push('Participant calendar test requires Test Taster.');}status.textContent=lines.join('\n');}
form.addEventListener('submit',async ev=>{ev.preventDefault();submit.disabled=true;status.textContent='Signing in…';try{const {data,error}=await db.auth.signInWithPassword({email:document.getElementById('email').value,password:document.getElementById('password').value});if(error)throw error;document.getElementById('password').value='';await inspect(data.session);}catch(e){status.textContent='Error: '+e.message;}finally{submit.disabled=false;}});
logout.addEventListener('click',async()=>{try{const {error}=await db.auth.signOut();if(error)throw error;await inspect(null);status.textContent='✓ Signed out successfully.';}catch(e){status.textContent='Error: '+e.message;}});
submit.disabled=false;const {data,error}=await db.auth.getSession();if(error)throw error;await inspect(data.session);
}catch(e){status.textContent='Connection error: '+e.message;}
</script></body></html>
